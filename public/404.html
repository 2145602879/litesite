<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面走丢了 · 404</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141416'/%3E%3Cpath d='M9 20L16 10L23 20' stroke='%23F26B21' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    /* 404 页面刻意做成纯内联、零外部请求：不给 1G 内存的机器添任何负担 */
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: #0E0E10; color: #EDEBE7;
      font-family: "Outfit", ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-image:
        radial-gradient(60% 50% at 15% 10%, rgba(242, 107, 33, .16), transparent 60%),
        radial-gradient(50% 45% at 85% 85%, rgba(242, 178, 33, .10), transparent 60%);
    }
    .wrap { max-width: 520px; text-align: left; }
    .code { font-size: clamp(72px, 18vw, 132px); line-height: .9; letter-spacing: -.04em; font-weight: 600; }
    .code span { color: #F26B21; }
    h1 { font-size: 22px; margin: 20px 0 10px; letter-spacing: -.01em; }
    p { color: #A8A29A; line-height: 1.7; font-size: 15px; }
    a {
      display: inline-block; margin-top: 26px; padding: 11px 20px; border-radius: 999px;
      background: #EDEBE7; color: #141416; text-decoration: none; font-weight: 500; font-size: 14px;
      transition: transform .18s ease, opacity .18s ease;
    }
    a:hover { opacity: .88; }
    a:active { transform: scale(.98); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">4<span>0</span>4</div>
    <h1>这个地址不存在</h1>
    <p>页面可能已经被移动、删除，或者链接里少了一个字符。回到首页继续逛吧。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
