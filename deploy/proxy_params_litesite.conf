# =====================================================================
#  Nginx 反向代理公共参数片段
#  nginx.conf 里通过 include 引用：
#     include /etc/nginx/proxy_params_litesite;
#  部署位置：/etc/nginx/proxy_params_litesite
# =====================================================================

proxy_http_version 1.1;
# upstream 里配了 keepalive，必须清空 Connection 头才能复用长连接
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# 让 Node 直接返回压缩后的响应时也能正确声明
proxy_set_header Accept-Encoding "";

# 超时设置：个人站请求都很轻，给短一点，避免慢连接长期占用 Node 连接数
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# 上游返回的缓存头优先（例如 /uploads/ 的 30 天）
proxy_buffering on;
proxy_buffers 8 16k;        # 单连接缓冲 128KB，够用且省内存
proxy_buffer_size 16k;
proxy_busy_buffers_size 32k;
