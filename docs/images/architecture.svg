<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="litesite 请求路径：Nginx 直出静态资源，Node 只处理 API">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#45454E"/>
    </marker>
    <marker id="arwDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A3A42"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="639" rx="16" fill="#0E0E11" stroke="#25252A"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <text x="48" y="58" fill="#8B857E" font-size="16" font-weight="600" letter-spacing="2.4">请求路径</text>
    <text x="952" y="58" fill="#5E5952" font-size="13.5" text-anchor="end">2 核 1G VPS</text>

    <!-- 主链路盒子 -->
    <g>
      <rect x="210" y="88" width="380" height="74" rx="12" fill="#16161A" stroke="#2B2B31"/>
      <rect x="211" y="106" width="3.5" height="38" rx="1.75" fill="#3E3E46"/>
      <text x="262" y="120" fill="#EFEDE8" font-size="19" font-weight="600">访客浏览器</text>
      <text x="262" y="143" fill="#7C766F" font-size="13">桌面端 / 移动端 · 深色模式</text>
    </g>

    <g>
      <rect x="210" y="200" width="380" height="90" rx="12" fill="#16161A" stroke="#2B2B31"/>
      <rect x="211" y="216" width="3.5" height="58" rx="1.75" fill="#F26B1F"/>
      <text x="262" y="240" fill="#EFEDE8" font-size="19" font-weight="600">Nginx</text>
      <text x="262" y="263" fill="#7C766F" font-size="13">TLS 终止 · 静态缓存 · 反向代理 · 限流</text>
    </g>

    <g>
      <rect x="210" y="330" width="380" height="100" rx="12" fill="#16161A" stroke="#2B2B31"/>
      <rect x="211" y="346" width="3.5" height="68" rx="1.75" fill="#F26B1F"/>
      <text x="262" y="372" fill="#EFEDE8" font-size="19" font-weight="600">Node + Express</text>
      <text x="262" y="395" fill="#7C766F" font-size="13">127.0.0.1:3000 · 堆上限 96MB</text>
      <text x="262" y="416" fill="#E9B03A" font-size="13">实测 RSS ≈ 70MB，堆仅 9MB</text>
    </g>

    <g>
      <rect x="210" y="470" width="380" height="84" rx="12" fill="#16161A" stroke="#2B2B31"/>
      <rect x="211" y="486" width="3.5" height="52" rx="1.75" fill="#F26B1F"/>
      <text x="262" y="507" fill="#EFEDE8" font-size="19" font-weight="600">SQLite 单文件</text>
      <text x="262" y="530" fill="#7C766F" font-size="13">data/litesite.db · WAL · 页缓存 4MB</text>
    </g>

    <!-- 竖箭头 -->
    <g stroke="#3E3E46" stroke-width="2" fill="none">
      <path d="M400 162 L400 194" marker-end="url(#arw)"/>
      <path d="M400 290 L400 324" marker-end="url(#arw)"/>
      <path d="M400 430 L400 464" marker-end="url(#arw)"/>
    </g>

    <!-- 右侧说明框 -->
    <g>
      <rect x="648" y="200" width="304" height="90" rx="12" fill="#131317" stroke="#34343C" stroke-dasharray="6 6"/>
      <text x="674" y="240" fill="#D9D4CD" font-size="16" font-weight="600">磁盘直出，不经过 Node</text>
      <text x="674" y="263" fill="#7C766F" font-size="13">HTML / CSS / JS / 图片 / 上传文件</text>
    </g>

    <g>
      <rect x="648" y="330" width="304" height="100" rx="12" fill="#131317" stroke="#34343C" stroke-dasharray="6 6"/>
      <text x="674" y="375" fill="#D9D4CD" font-size="16" font-weight="600">PM2 托管</text>
      <text x="674" y="398" fill="#7C766F" font-size="13">fork 单进程，超 150MB 自动重启</text>
      <text x="674" y="418" fill="#7C766F" font-size="13">开机自启 · 日志轮转</text>
    </g>

    <!-- 虚线连接 -->
    <g stroke="#3A3A42" stroke-width="1.6" fill="none" stroke-dasharray="5 5">
      <path d="M590 245 L641 245" marker-end="url(#arwDash)"/>
      <path d="M590 380 L641 380" marker-end="url(#arwDash)"/>
    </g>

    <!-- 箭头标注 -->
    <text x="418" y="186" fill="#8B857E" font-size="13">HTTPS :443</text>
    <text x="418" y="314" fill="#F26B1F" font-size="13.5" font-weight="600">/api/*</text>
    <text x="418" y="454" fill="#8B857E" font-size="13">better-sqlite3 同步调用</text>

    <text x="48" y="594" fill="#8B857E" font-size="14">静态资源由 Nginx 直接返回，Node 只处理 /api/*，这是常驻内存能压在 70MB 的关键</text>
  </g>
</svg>
