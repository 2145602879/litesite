# =====================================================================
#  litesite Nginx 反向代理 + 静态资源托管配置
# ---------------------------------------------------------------------
#  设计目标：让 Nginx 承担所有静态文件与图片请求，Node 只处理 /api/*
#  这样 1 核 1G 的机器也能轻松扛住日常访问。
#
#  部署位置：/etc/nginx/sites-available/litesite
#  启用：ln -s /etc/nginx/sites-available/litesite /etc/nginx/sites-enabled/
#  校验：nginx -t && systemctl reload nginx
#
#  注意：下面的 limit_req_zone 必须放在 http {} 上下文里。
#        Debian / Ubuntu 的 sites-enabled/*.conf 正是被包含在 http {} 内的，
#        所以直接写在本文件顶部即可，无需改动 nginx.conf。
# =====================================================================

# 每个 IP 的请求限速区（5m 约可记录 4 万个 IP，占用内存很小）
limit_req_zone $binary_remote_addr zone=litesite_api:5m rate=120r/m;
limit_req_zone $binary_remote_addr zone=litesite_login:5m rate=20r/m;

# 后端 Node 服务
upstream litesite_node {
    server 127.0.0.1:3000;
    keepalive 8;               # 复用长连接，减少握手开销
}

# HTTP：仅用于跳转 HTTPS 与 certbot 验证
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # ← 改成你的域名

    # Let's Encrypt 的 HTTP-01 验证必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # 申请证书前先注释掉下面这行，否则验证会 301 失败
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;   # ← 改成你的域名

    # ---------- 证书（certbot 会自动写入）----------
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;           # 只有 2MB，省内存
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 站点根目录 ----------
    root /var/www/litesite/public;
    index index.html;

    charset utf-8;
    client_max_body_size 3m;        # 与 .env 的 UPLOAD_MAX_KB 匹配（默认 2MB）
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 30s;

    # ---------- 压缩：只压文本类，图片本身已压缩不必再压 ----------
    gzip on;
    gzip_comp_level 5;              # 5 是 CPU 与压缩率的最佳平衡点
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # =================================================================
    #  1. 用户上传的图片：Nginx 直接读磁盘，请求完全不进 Node
    # =================================================================
    location ^~ /uploads/ {
        alias /var/www/litesite/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;              # 静态图片不记日志，省磁盘 IO
        try_files $uri =404;
    }

    # =================================================================
    #  2. 前端静态资源：长缓存 + 不记日志
    # =================================================================
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # =================================================================
    #  3. 管理后台页面：直接由 Nginx 返回静态文件，不经过 Node
    #     （鉴权在浏览器侧完成，真正的数据接口仍然受服务端保护）
    # =================================================================
    location = /admin {
        add_header Cache-Control "no-store";
        try_files /admin.html =404;
    }
    location = /admin/ {
        add_header Cache-Control "no-store";
        try_files /admin.html =404;
    }

    # =================================================================
    #  4. 登录接口：单独限速，防暴力破解（服务端还有一层账号级封禁）
    # =================================================================
    location = /api/admin/login {
        limit_req zone=litesite_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://litesite_node;
        include /etc/nginx/proxy_params_litesite;
    }

    # =================================================================
    #  5. 其余 API：交给 Node
    # =================================================================
    location /api/ {
        limit_req zone=litesite_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://litesite_node;
        include /etc/nginx/proxy_params_litesite;
    }

    # =================================================================
    #  6. 其它路径：先找静态文件，找不到就回落到 Node（404 页等）
    # =================================================================
    location / {
        try_files $uri $uri/ @node;
    }

    location @node {
        proxy_pass http://litesite_node;
        include /etc/nginx/proxy_params_litesite;
    }

    # =================================================================
    #  7. 兜底防护：数据库文件、隐藏文件、备份文件一律拒绝
    # =================================================================
    location ~ /\.(?!well-known) { deny all; access_log off; }
    location ~* \.(?:db|db-wal|db-shm|sqlite3?|sql|bak|log|env|md)$ { deny all; access_log off; }
    location ^~ /data/ { deny all; }

    # 自定义错误页
    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;
    location = /404.html { internal; }
}
