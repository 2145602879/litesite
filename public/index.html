<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)" />
<title>个人主页</title>
<meta name="description" content="作品集、笔记与联系方式" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316161A'/%3E%3Cpath d='M9 20L16 10L23 20' stroke='%23F26B21' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<!-- 字体：只取需要的字重，display=swap 避免文字长时间不可见 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<!--
  主题变量必须在 Tailwind 之前就位，否则首屏会闪一下白底。
  颜色以 RGB 三元组形式声明，配合 Tailwind 的 rgb(var(--x) / <alpha-value>) 使用，
  这样改主题只需要改下面这一组变量。
-->
<style>
  :root {
    --c-bg: 245 245 243;
    --c-elev: 255 255 255;
    --c-fg: 22 22 26;
    --c-muted: 108 108 116;
    --c-line: 22 22 26;
    --c-accent: 226 88 20;
    --c-accent2: 202 138 12;
    color-scheme: light;
  }
  html.dark {
    --c-bg: 14 14 17;
    --c-elev: 22 22 27;
    --c-fg: 237 237 234;
    --c-muted: 152 152 160;
    --c-line: 255 255 255;
    --c-accent: 242 118 46;
    --c-accent2: 233 176 58;
    color-scheme: dark;
  }
  html { background-color: rgb(var(--c-bg)); }
  body {
    margin: 0;
    background-color: rgb(var(--c-bg));
    color: rgb(var(--c-fg));
    font-family: "Outfit", ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* 主题切换时的颜色过渡，克制且只在切换瞬间生效 */
  html.theme-anim, html.theme-anim body { transition: background-color .35s ease, color .35s ease; }
</style>

<!-- 防闪烁：在渲染前决定深浅色（放在 body 之前执行） -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = saved ? saved === 'dark' : prefersDark;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) { /* 隐私模式下 localStorage 可能不可用，忽略 */ }
  })();
</script>

<!-- TailwindCSS：Play CDN 模式，零构建、零 node_modules 前端依赖 -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          bg: 'rgb(var(--c-bg) / <alpha-value>)',
          elev: 'rgb(var(--c-elev) / <alpha-value>)',
          fg: 'rgb(var(--c-fg) / <alpha-value>)',
          muted: 'rgb(var(--c-muted) / <alpha-value>)',
          line: 'rgb(var(--c-line) / <alpha-value>)',
          accent: 'rgb(var(--c-accent) / <alpha-value>)',
          accent2: 'rgb(var(--c-accent2) / <alpha-value>)'
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          sans: ['Outfit', 'ui-sans-serif', 'system-ui', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
          mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace']
        },
        // 全站统一圆角体系：卡片 20px，控件 999px（药丸）
        borderRadius: { card: '20px' },
        maxWidth: { shell: '1180px' }
      }
    }
  };
</script>
<link rel="stylesheet" href="/css/app.css?v=2" />
</head>

<body class="bg-bg text-fg font-sans antialiased">

<!-- 纸张颗粒质感：纯 CSS 内联 SVG，无额外请求 -->
<div class="grain" aria-hidden="true"></div>
<!-- 柔和渐变光晕：两团低透明度色块，营造"艺术感"但不抢内容 -->
<div class="aurora" aria-hidden="true"></div>

<!-- ============================= 导航 ============================= -->
<header class="fixed inset-x-0 top-0 z-40 border-b border-line/10 bg-bg/80 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-shell items-center gap-4 px-5 sm:px-8">
    <a href="#top" class="flex items-center gap-2.5 shrink-0">
      <span class="grid h-8 w-8 place-items-center rounded-[10px] bg-fg text-bg">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 17L12 7L18 17" />
        </svg>
      </span>
      <span class="font-display text-[15px] font-semibold tracking-tight" data-bind="brandName">个人主页</span>
    </a>

    <!-- 桌面端导航：单行，不超过 80px 高 -->
    <nav class="ml-auto hidden items-center gap-1 md:flex" aria-label="主导航">
      <a href="#work" class="nav-link">作品</a>
      <a href="#notes" class="nav-link">笔记</a>
      <a href="#about" class="nav-link">关于</a>
      <a href="#contact" class="nav-link">联系我</a>
    </nav>

    <div class="ml-auto flex items-center gap-2 md:ml-3">
      <button id="themeBtn" type="button" class="icon-btn" aria-label="切换深浅主题" title="切换深浅主题">
        <svg class="h-[18px] w-[18px] dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" />
        </svg>
        <svg class="hidden h-[18px] w-[18px] dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" />
        </svg>
      </button>
      <button id="menuBtn" type="button" class="icon-btn md:hidden" aria-label="打开菜单" aria-expanded="false">
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>
  </div>

  <!-- 移动端抽屉 -->
  <div id="mobileNav" class="hidden border-t border-line/10 bg-bg/95 px-5 pb-4 pt-2 backdrop-blur-md md:hidden">
    <a href="#work" class="drawer-link">作品</a>
    <a href="#notes" class="drawer-link">笔记</a>
    <a href="#about" class="drawer-link">关于</a>
    <a href="#contact" class="drawer-link">联系我</a>
  </div>
</header>

<main id="top" class="relative z-10">

  <!-- ============================= 首屏 ============================= -->
  <!-- 左文右图的不对称构图，避免"居中大标题 + 渐变背景"的通用模板感 -->
  <section class="mx-auto max-w-shell px-5 pt-24 sm:px-8 sm:pt-28">
    <div class="grid items-center gap-12 lg:grid-cols-12 lg:gap-10">
      <div class="lg:col-span-7">
        <p class="reveal text-[13px] font-medium uppercase tracking-[0.18em] text-muted" data-bind="role">产品设计师 / 全栈开发者</p>
        <h1 class="reveal mt-5 font-display text-[40px] font-semibold leading-[1.06] tracking-tight sm:text-[54px] lg:text-[60px]" style="transition-delay:60ms">
          <span data-bind="name">林知远</span>
        </h1>
        <p class="reveal mt-6 max-w-[46ch] text-[17px] leading-relaxed text-muted sm:text-[18px]" style="transition-delay:120ms" data-bind="tagline">
          把复杂的事情做简单，把简单的事情做漂亮。
        </p>

        <div class="reveal mt-9 flex flex-wrap items-center gap-3" style="transition-delay:180ms">
          <a href="#work" class="btn-primary">查看作品</a>
          <a href="#contact" class="btn-ghost">联系我</a>
        </div>

        <!-- 真实统计，不是装饰性数字 -->
        <dl class="reveal mt-12 flex flex-wrap gap-x-10 gap-y-4 border-t border-line/10 pt-6" style="transition-delay:240ms">
          <div>
            <dt class="text-[12px] uppercase tracking-[0.14em] text-muted">作品</dt>
            <dd class="font-display text-[22px] font-semibold" data-bind="statProjects">0</dd>
          </div>
          <div>
            <dt class="text-[12px] uppercase tracking-[0.14em] text-muted">文章</dt>
            <dd class="font-display text-[22px] font-semibold" data-bind="statPosts">0</dd>
          </div>
        </dl>
      </div>

      <div class="reveal lg:col-span-5" style="transition-delay:120ms">
        <div class="relative mx-auto max-w-[360px] lg:max-w-none">
          <div class="absolute -inset-4 rounded-[36px] bg-gradient-to-br from-accent/25 via-accent2/15 to-transparent blur-2xl" aria-hidden="true"></div>
          <img
            data-bind="avatar"
            src="https://picsum.photos/seed/litesite-avatar/720/720"
            alt="头像"
            width="720" height="720" decoding="async"
            class="relative aspect-square w-full rounded-[28px] border border-line/10 bg-elev object-cover shadow-[0_24px_70px_-30px_rgba(0,0,0,.45)]"
            onerror="this.style.visibility='hidden'" />
          <div class="absolute -bottom-3 -left-3 rounded-[14px] border border-line/10 bg-elev/90 px-3.5 py-2 backdrop-blur-sm">
            <span class="text-[12px] text-muted">开放合作中</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================= 作品集 ============================= -->
  <section id="work" class="mx-auto max-w-shell scroll-mt-24 px-5 pt-28 sm:px-8 sm:pt-36">
    <div class="reveal max-w-[52ch]">
      <h2 class="font-display text-[30px] font-semibold tracking-tight sm:text-[36px]">作品集</h2>
      <p class="mt-3 text-[16px] leading-relaxed text-muted">几个自己一直在用、也愿意一直维护下去的小东西。</p>
    </div>

    <div id="projectGrid" class="mt-12 grid grid-cols-1 gap-5 md:grid-cols-6">
      <!-- JS 渲染骨架屏 -->
      <div class="skeleton md:col-span-4 aspect-[16/10]"></div>
      <div class="skeleton md:col-span-2 aspect-[4/3]"></div>
      <div class="skeleton md:col-span-2 aspect-[4/3]"></div>
      <div class="skeleton md:col-span-4 aspect-[16/10]"></div>
    </div>
  </section>

  <!-- ============================= 博客列表 ============================= -->
  <section id="notes" class="mx-auto max-w-shell scroll-mt-24 px-5 pt-28 sm:px-8 sm:pt-36">
    <div class="reveal flex flex-wrap items-end justify-between gap-4">
      <div class="max-w-[52ch]">
        <h2 class="font-display text-[30px] font-semibold tracking-tight sm:text-[36px]">笔记</h2>
        <p class="mt-3 text-[16px] leading-relaxed text-muted">关于设计、工程与两者之间那条模糊的边界。</p>
      </div>
      <button id="loadMoreBtn" type="button" class="btn-ghost hidden">加载更多</button>
    </div>

    <div id="postList" class="mt-10 border-t border-line/10">
      <div class="skeleton-post"></div>
      <div class="skeleton-post"></div>
      <div class="skeleton-post"></div>
    </div>
  </section>

  <!-- ============================= 关于 / 技能 ============================= -->
  <section id="about" class="mx-auto max-w-shell scroll-mt-24 px-5 pt-28 sm:px-8 sm:pt-36">
    <div class="grid gap-14 lg:grid-cols-12">
      <div class="reveal lg:col-span-5">
        <h2 class="font-display text-[30px] font-semibold tracking-tight sm:text-[36px]">关于我</h2>
        <p class="mt-5 whitespace-pre-line text-[16px] leading-[1.85] text-muted" data-bind="bio"></p>
        <p class="mt-6 flex items-center gap-2 text-[14px] text-muted">
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z" /><circle cx="12" cy="10" r="2.6" />
          </svg>
          <span data-bind="location">成都 · 中国</span>
        </p>
      </div>

      <div class="reveal lg:col-span-7" style="transition-delay:80ms">
        <div id="skillGroups" class="space-y-8"></div>
      </div>
    </div>
  </section>

  <!-- ============================= 联系 + 留言 ============================= -->
  <section id="contact" class="mx-auto max-w-shell scroll-mt-24 px-5 pt-28 sm:px-8 sm:pt-36">
    <div class="reveal max-w-[52ch]">
      <h2 class="font-display text-[30px] font-semibold tracking-tight sm:text-[36px]">联系我</h2>
      <p class="mt-3 text-[16px] leading-relaxed text-muted">邮件最快回复。想聊什么都行，不用先自我介绍。</p>
    </div>

    <div class="mt-12 grid gap-12 lg:grid-cols-12">
      <!-- 联系方式：左侧信息列表 -->
      <div class="lg:col-span-5">
        <ul id="contactList" class="divide-y divide-line/10 border-y border-line/10"></ul>
      </div>

      <!-- 留言表单 -->
      <div class="lg:col-span-7">
        <form id="messageForm" class="rounded-card border border-line/10 bg-elev/60 p-6 sm:p-7" novalidate>
          <div class="grid gap-5 sm:grid-cols-2">
            <div class="flex flex-col gap-2">
              <label for="msgName" class="text-[13px] font-medium text-fg">称呼</label>
              <input id="msgName" name="name" type="text" maxlength="40" required
                     class="field" placeholder="怎么称呼你" autocomplete="name" />
            </div>
            <div class="flex flex-col gap-2">
              <label for="msgEmail" class="text-[13px] font-medium text-fg">邮箱（选填）</label>
              <input id="msgEmail" name="email" type="email" maxlength="120"
                     class="field" placeholder="只在需要回复时使用" autocomplete="email" />
            </div>
          </div>
          <div class="mt-5 flex flex-col gap-2">
            <label for="msgContent" class="text-[13px] font-medium text-fg">留言内容</label>
            <textarea id="msgContent" name="content" rows="5" maxlength="1000" required
                      class="field resize-y" placeholder="写点什么，比如你在做什么，或者想聊的话题"></textarea>
            <div class="flex items-center justify-between gap-3">
              <span id="msgHint" class="text-[12.5px] text-muted" role="status" aria-live="polite"></span>
              <span id="msgCount" class="font-mono text-[12px] text-muted">0 / 1000</span>
            </div>
          </div>
          <div class="mt-5 flex flex-wrap items-center gap-3">
            <button id="msgSubmit" type="submit" class="btn-primary">发送留言</button>
            <span class="text-[12.5px] text-muted">每个 IP 十分钟内最多 3 条。</span>
          </div>
        </form>
      </div>
    </div>

    <!-- 留言墙 -->
    <div class="mt-20">
      <h3 class="font-display text-[20px] font-semibold tracking-tight">留言墙</h3>
      <div id="guestbook" class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        <div class="skeleton h-32"></div>
        <div class="skeleton hidden h-32 sm:block"></div>
        <div class="skeleton hidden h-32 lg:block"></div>
      </div>
    </div>
  </section>

  <!-- ============================= 页脚 ============================= -->
  <footer class="mt-32 border-t border-line/10">
    <div class="mx-auto flex max-w-shell flex-col gap-3 px-5 py-10 sm:flex-row sm:items-center sm:justify-between sm:px-8">
      <p class="text-[13.5px] text-muted">
        <span data-bind="name">林知远</span> · <span data-bind="year">2025</span> · 保留所有权利
      </p>
      <div class="flex items-center gap-5 text-[13.5px]">
        <a href="/admin" class="foot-link">管理后台</a>
        <a href="#top" class="foot-link">回到顶部</a>
      </div>
    </div>
  </footer>
</main>

<!-- ============================= 文章阅读层 ============================= -->
<!-- 用原生 dialog 实现，点击遮罩即可关闭，不需要额外的模态框架 -->
<dialog id="reader" class="reader">
  <article class="reader-inner">
    <header class="reader-head">
      <div class="min-w-0">
        <p class="reader-meta" id="readerMeta"></p>
        <h2 id="readerTitle" class="mt-2 font-display text-[26px] font-semibold leading-snug tracking-tight sm:text-[32px]"></h2>
      </div>
      <button id="readerClose" type="button" class="icon-btn shrink-0" aria-label="关闭文章">
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>
    <div id="readerBody" class="md-body"></div>
    <footer class="reader-foot">
      <button id="readerPrev" type="button" class="btn-ghost hidden"></button>
    </footer>
  </article>
</dialog>

<!-- Markdown 渲染与 XSS 过滤：都在浏览器侧，服务器不消耗内存做渲染 -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<script src="/js/app.js?v=2" defer></script>
</body>
</html>
